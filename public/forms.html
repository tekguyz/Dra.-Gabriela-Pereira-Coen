<!DOCTYPE html>
<html>
  <head>
    <title>Netlify Forms - Dental Intake</title>
  </head>
  <body>
    <!-- Static representation of the dental_intake form for Netlify build discovery -->
    <form name="dental_intake" data-netlify="true" netlify-honeypot="bot-field" encType="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="dental_intake" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <textarea name="description"></textarea>
    </form>
  </body>
</html>
